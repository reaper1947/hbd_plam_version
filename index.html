<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Happy Birthday To Mew 🎂</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      animation: fadeIn 2s ease;
      z-index: 1;
    }

    h1 {
      font-size: 2.2rem;
      color: #ff4e50;
    }

    p {
      font-size: 1.2rem;
      color: #333;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff4e50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }

    .btn:hover {
      background: #fc913a;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    /* Popup overlay */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      z-index: 999;
      animation: explode 0.8s ease-out forwards;
      overflow: hidden;
    }

    @keyframes explode {
      from {
        transform: scale(0.1);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .popup img {
      position: absolute;
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      animation: bounceIn 1s ease, floatMove 6s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }

      70% {
        transform: scale(0.9);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes floatMove {
      0% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(15px, -10px) scale(1.05);
      }

      50% {
        transform: translate(-10px, 20px) scale(0.95);
      }

      75% {
        transform: translate(10px, -15px) scale(1.02);
      }

      100% {
        transform: translate(0, 0) scale(1);
      }
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      background: #ff4e50;
      color: white;
      border: none;
      font-size: 1.5rem;
      padding: 8px 15px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1000;
    }

    .close-btn:hover {
      background: #fc913a;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      color: red;
      font-size: 2rem;
      animation: floatUp 3s ease-in forwards;
      z-index: 1001;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      to {
        transform: translateY(-600px) scale(1.5);
        opacity: 0;
      }
    }

    .love-text {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      animation: fadeIn 2s ease;
      z-index: 1002;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🎉 Happy Birthday To Mew! 🎉</h1>
    <p>
      สุขสันต์วันเกิดนะครับหนูมิว ❤️<br>
      โตขึ้นอีกปีแล้ว ขอให้อีก 7 เดือนที่เหลือ<br>
      ขอให้หนูมีรอยยิ้ม มีความสุข และสุขภาพแข็งแรง<br>
      และได้รับความรักจากทุกคนเยอะๆเลยนะ 🎂
    </p>
    <button class="btn" onclick="showSurprise()">Click Me 🎁</button>
  </div>

  <!-- Confetti -->
  <canvas id="confetti"></canvas>

  <!-- Background Music -->
  <audio id="bg-music" loop>
    <source src="music/universe.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showSurprise() {
      const popup = document.createElement("div");
      popup.className = "popup";

      // ปุ่มปิด popup
      const closeBtn = document.createElement("button");
      closeBtn.className = "close-btn";
      closeBtn.innerText = "✖";
      closeBtn.onclick = () => {
        popup.remove();
        document.getElementById("bg-music").pause();
        document.getElementById("bg-music").currentTime = 0;
      };
      popup.appendChild(closeBtn);

      // container สำหรับรูป
      const imgContainer = document.createElement("div");
      popup.appendChild(imgContainer);

      // รายการรูปทั้งหมด (Updated for 10 images)
      const totalImages = 10;
      let currentBatch = 0;
      const batchSize = 5;

      function showBatch() {
        if (!document.body.contains(popup)) return;
        imgContainer.innerHTML = ""; // เคลียร์ batch เก่า
        for (let i = 0; i < batchSize; i++) {
          const index = (currentBatch * batchSize + i) % totalImages + 1;
          const img = document.createElement("img");
          img.src = 'img/photo' + index + '.jpg';
          img.style.top = Math.random() * 70 + 10 + "%";
          img.style.left = Math.random() * 70 + 10 + "%";
          img.style.animationDuration = (6 + Math.random() * 6) + "s";
          img.style.animationDelay = (Math.random() * 3) + "s";
          imgContainer.appendChild(img);
        }
        currentBatch++;
      }

      // สลับ batch ทุก 4 วินาที
      showBatch();
      const batchInterval = setInterval(showBatch, 4000);

      // ข้อความรัก
      const loveText = document.createElement("div");
      loveText.className = "love-text";
      loveText.innerText = "❤️ เค้ารักเธอนะ Mew ❤️";
      popup.appendChild(loveText);

      document.body.appendChild(popup);

      // Hearts floating
      const heartInterval = setInterval(() => {
        if (!document.body.contains(popup)) {
          clearInterval(heartInterval);
          clearInterval(batchInterval);
          return;
        }
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        document.body.appendChild(heart);
        setTimeout(() => { if(heart.parentNode) heart.remove(); }, 3000);
      }, 500);

      // Play music
      document.getElementById("bg-music").play().catch(e => console.error("Audio play failed:", e));
    }

    /* Confetti */
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confetti = Array.from({ length: 150 }).map(() => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 6 + 2,
      dx: Math.random() - 0.5,
      dy: Math.random() * 2 + 1,
      color: "hsl(" + (Math.random() * 360) + ",100%,50%)"
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confetti.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = c.color;
        ctx.fill();
        c.x += c.dx;
        c.y += c.dy;
        if (c.y > canvas.height) c.y = 0;
      });
      requestAnimationFrame(draw);
    }
    
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    draw();
  </script>
</body>

</html>
